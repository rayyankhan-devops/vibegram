name: Automated Tests

on:
  workflow_call:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ============================================================================
  # 🐍 1. Python Backend Tests (Pytest)
  # ============================================================================
  test-backend:
    name: 🐍 Backend Tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Test Suite
        env:
          ENVIRONMENT: test
          JWT_SECRET: test_jwt_secret_key_1234567890_vibegram
          MONGODB_DATABASE: vibegram_test_db
        run: pytest -v


  # ============================================================================
  # ⚡ 2. Node.js Frontend Tests (Vitest + Build Check)
  # ============================================================================
  test-frontend:
    name: ⚡ Frontend Tests (Vitest + Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🧪 Run Vitest Component & Unit Tests
        run: npm run test

      - name: 🏗️ Verify Production Bundle Build
        run: npm run build
