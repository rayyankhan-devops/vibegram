name: Master CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: 1. Secret Scan Stage
    uses: ./.github/workflows/secret-scan.yml

  linting:
    name: 2. Linting Stage
    needs: secret-scan
    uses: ./.github/workflows/lint.yml

  testing:
    name: 3. Testing Stage
    needs: linting
    uses: ./.github/workflows/test.yml

  code-quality:
    name: 4. Code Quality Stage
    needs: testing
    uses: ./.github/workflows/code-quality.yml