name: VibeGram Master CI Pipeline

on:
  workflow_dispatch:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    name: 🔍 Linting Stage
    uses: ./.github/workflows/lint.yml

  testing:
    name: 🧪 Testing Stage
    needs: linting
    uses: ./.github/workflows/test.yml