name: VibeGram Master CI Pipeline

on:
  push:
    branches: [main, master, dev, develop]
  pull_request:
    branches: [main, master, dev, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 🔍 STAGE 1: LINTING & CODE QUALITY
  # ============================================================================
  lint-backend:
    name: 🐍 Lint Backend (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Ruff Linter Check
        run: ruff check .

      - name: 🎨 Ruff Formatting Check
        run: ruff format --check .

  lint-frontend:
    name: ⚡ Lint Frontend (ESLint + Prettier + TSC)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        run: npm ci

      - name: 🔍 ESLint Check
        run: npm run lint

      - name: 🎨 Prettier Formatting Check
        run: npm run format:check

      - name: 🛡️ TypeScript Compiler Check
        run: npx tsc --noEmit


  # ============================================================================
  # 🧪 STAGE 2: AUTOMATED TESTING (Runs after linting passes)
  # ============================================================================
  test-backend:
    name: 🐍 Test Backend (Pytest)
    runs-on: ubuntu-latest
    needs: [lint-backend]
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧪 Run Pytest Suite
        env:
          ENVIRONMENT: test
          JWT_SECRET: test_jwt_secret_key_1234567890_vibegram
          MONGODB_DATABASE: vibegram_test_db
        run: pytest -v

  test-frontend:
    name: ⚡ Test Frontend (Vitest)
    runs-on: ubuntu-latest
    needs: [lint-frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Run Vitest Suite
        run: npm run test

      - name: 🏗️ Verify Production Bundle Build
        run: npm run build


  # ============================================================================
  # 🐳 STAGE 3: DOCKER BUILD VALIDATION (Ensures Dockerfiles compile cleanly)
  # ============================================================================
  docker-build-check:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build Backend Image (Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: vibegram-backend:ci-check

      - name: 🐳 Build Frontend Image (Dry-run)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.busybox
          push: false
          tags: vibegram-frontend:ci-check


  # ============================================================================
  # 🏁 STAGE 4: CI PIPELINE GATEWAY / STATUS
  # ============================================================================
  ci-status:
    name: 🏁 CI Pipeline Passed
    runs-on: ubuntu-latest
    needs: [lint-backend, lint-frontend, test-backend, test-frontend, docker-build-check]
    steps:
      - name: ✅ Report CI Success
        run: echo "🎉 All Linting, Testing, and Docker Build checks passed successfully!"
