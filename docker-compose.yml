services:
  vibegram-db:
    image: mongodb/mongodb-community-server:8.0-ubi8-slim
    container_name: vibegram-db
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: vibegram_db
    ports:
      - "27017:27017"
    volumes:
      - vibegram-db-data:/data/db
      - ./database/seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    networks:
      - vibegram
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  vibegram-backend:
    image: rayyan12311/vibegram-be:v1.0.0
    container_name: vibegram-backend
    restart: unless-stopped
    depends_on:
      vibegram-db:
        condition: service_healthy
    networks:
      - vibegram
    environment:
      - MONGODB_URI=mongodb://vibegram-db:27017
      - MONGODB_DATABASE=vibegram_db
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173
      - JWT_SECRET=vibegram_dev_secret_key_change_in_production_9876543210_token_secret
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=1440
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - ENVIRONMENT=development
    ports:
      - "8000:8000"

  vibegram-frontend:
    image: rayyan12311/vibegram-fe-busybox:v1.0.0
    container_name: vibegram-frontend
    user: root
    restart: unless-stopped
    depends_on:
      - vibegram-backend
    networks:
      - vibegram
    ports:
      - "8080:8080"

volumes:
  vibegram-db-data:
    driver: local

networks:
  vibegram:
    driver: bridge