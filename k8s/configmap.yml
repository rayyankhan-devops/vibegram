apiVersion: v1
kind: ConfigMap
metadata:
  name: vibegram-mongo-configmap
  namespace: vibegram
data:
  MONGO_INITDB_DATABASE: "vibegram_db"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: vibegram-backend-configmap
  namespace: vibegram
data:
  MONGODB_URI: "mongodb://vibegram-mongo-service:27017"
  MONGODB_DATABASE: "vibegram_db"
  CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173"
  JWT_SECRET: "vibegram_dev_secret_key_change_in_production_9876543210_token_secret"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRE_MINUTES: "1440"
  BACKEND_HOST: "0.0.0.0"
  BACKEND_PORT: "8000"
  ENVIRONMENT: "development"

---

