apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibegram-backend-deployment
  namespace: vibegram
  labels:
    app: vibegram-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibegram-backend
  template:
    metadata:
      labels:
        app: vibegram-backend
    spec:
      containers:
        - name: vibegram-backend
          image: rayyan12311/vibegram-be:v1.0.1
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: vibegram-backend-configmap

          resources:
            requests:
              memory: "64Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"

          ports:
            - containerPort: 8000
              name: http

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3