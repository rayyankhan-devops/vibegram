apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vibegram-backend-hpa
  namespace: vibegram
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vibegram-backend-deployment
  minReplicas: 1
  maxReplicas: 15
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
