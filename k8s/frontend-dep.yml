apiVersion: apps/v1
kind: Deployment
metadata:
  name: vibegram-frontend-deployment
  namespace: vibegram
  labels:
    app: vibegram-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vibegram-frontend
  template:
    metadata:
      labels:
        app: vibegram-frontend
    spec:
      containers:
      - name: vibegram-frontend
        image: rayyan12311/vibegram-fe-busybox:v1.0.1
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8080
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3